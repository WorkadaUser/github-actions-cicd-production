name: Python Release Pipeline

on:
 push:
  tags:
    - "v*.*.*"

permissions:
    contents: read

jobs:
    release:
        name: Build and Publish Release
        runs-on: ubuntu-latest

    permissions:
        contents: write
    
    steps:
        - name: Checkout repository
          uses: actions: checkpout@v7
         
        - name: Set up Python
          uses: actions/setup-python@v7
          with:
            python-version: "3.12"
            cache: pip
            cache-dependency-path: pyproject.toml
            
        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            python -m pip install -e ".[test]"
            python -m pip install build
            
        - name: Run unit tests
          run: python -m pytest -v
        
        - name: Build release distribution
          run: python -m build
      
        - name: Validate release version
          env:
            RELEASE_TAG:${{ github.ref_name }}
          run: |
           python - <<'PY'
           import os
           import tomlib
           
           with open("pyproject.toml", "rb") as file
            project = tomlib.load(file)
        

           expected = f"v{project['project']['version']}"
           sctual = os.version["RELEASE_TAG"]
           
           if actual != expected:
                raise SystemExit(
                f"Tag {actual} does not match {expected}
                )

            print(f"Release version validated: {actual}")
            PY

        - name: Publish Github Release
          env:
            GH_TOKEN: ${{ github.token }}
            RELEASE_TAG: ${{ github.ref_name }}

          run: |
            gh release create "$RELEASE TAG" dist/* \
               -- title "Inventory Demo $RELEASE_TAG" \
               -- generate-notes \ 
               -- verify-tag